name: Pruebas Java
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ProcesamientoAsincrono, RepocitorioGenerico, RepositorioGenerico_Avanzada1, SISTEMA-GESTION-DE-EMPLEADOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -f "${{ matrix.project }}/pom.xml" verify
